[package]
name = "heartopia-photo-tool"
version = "0.1.0"
description = "Offline read-only Heartopia photo decryption workstation"
edition = "2021"
rust-version = "1.82"

[lib]
name = "heartopia_photo_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
base64 = "0.22"
lru = "0.16"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
heartopia-photo-core = { path = "../crates/photo-core" }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
panic = "abort"
