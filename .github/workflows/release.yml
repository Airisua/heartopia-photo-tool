name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-build:
    name: Build and verify signed Windows package
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependency downloads only
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: false

      - name: Install frontend dependencies without release secrets
        run: npm ci

      - name: Check tag matches package version
        shell: pwsh
        run: node scripts/check-release-tag.mjs --tag "$env:RELEASE_TAG"

      - name: Verify signing key is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Updater signing key is missing; no secret value is displayed.'
          }

      - name: Privacy scanner and publication verifier tests
        run: node --test scripts/privacy-scan.node.mjs scripts/verify-published-release.node.mjs

      - name: Scan working tree and complete published history
        run: |
          node scripts/scan-secrets.mjs
          node scripts/scan-secrets.mjs --history

      - name: Frontend checks and production build without release secrets
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Rust formatting, clippy and tests without signing key
        run: |
          cargo fmt --manifest-path crates/photo-core/Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path crates/photo-core/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/photo-core/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Prepare private build-hook override and release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .local,artifacts/release -Force | Out-Null
          Set-Content -LiteralPath .local/release-build.json -Encoding utf8NoBOM -Value '{"build":{"beforeBuildCommand":null,"beforeBundleCommand":null}}'
          node scripts/release-notes.mjs --version "$env:RELEASE_TAG" --file CHANGELOG.md --output artifacts/release/release-notes.md

      - name: Compile native application with crypto material only
        env:
          HEARTOPIA_RELEASE: "1"
          HEARTOPIA_CRYPTO_MATERIAL_B64: ${{ secrets.HEARTOPIA_CRYPTO_MATERIAL_B64 }}
        run: |
          node scripts/verify-crypto-material.mjs --require
          node scripts/preflight-release.mjs --release
          npm run tauri -- build --no-bundle --ci --config .local/release-build.json

      - name: Bundle and sign without exposing signing key to Cargo or frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- bundle --bundles nsis --ci --config .local/release-build.json

      - name: Assemble and validate release assets before publication
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -File | Where-Object { $_.Name -match '-setup\.exe$' })
          if ($setups.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $setup = $setups[0]
          Copy-Item -LiteralPath $setup.FullName -Destination artifacts/release
          Copy-Item -LiteralPath ($setup.FullName+'.sig') -Destination artifacts/release
          node scripts/generate-release-manifest.mjs --setup $setup.FullName --sig ($setup.FullName+'.sig') --version ($env:RELEASE_TAG -replace '^v','') --tag "$env:RELEASE_TAG" --repo Airisua/heartopia-photo-tool --notes-file artifacts/release/release-notes.md --output artifacts/release/latest.json
          node scripts/verify-release-artifacts.mjs --bundle-dir src-tauri/target/release/bundle/nsis --manifest artifacts/release/latest.json --summary artifacts/release/release-summary.json
          $digest = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/release/SHA256SUMS.txt'), ($digest+'  '+$setup.Name+"`n"))

      - name: Authoritative Tauri updater positive and tampering verification
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -File | Where-Object { $_.Name -match '-setup\.exe$' }
          ./scripts/local-verify-update.ps1 -Package $setup.FullName -Signature ($setup.FullName+'.sig') -Manifest artifacts/release/latest.json

      - name: Upload verified assets only
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-release
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified release
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release scripts without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: signed-windows-release
          path: artifacts/release

      - name: Verify artifact checksum before uploading
        working-directory: artifacts/release
        run: sha256sum --check SHA256SUMS.txt

      - name: Create draft and upload verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "心动小镇图片解密工具 $RELEASE_TAG" --notes-file artifacts/release/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/release/*-setup.exe artifacts/release/*-setup.exe.sig artifacts/release/latest.json artifacts/release/SHA256SUMS.txt

      - name: Publish only after all package and signature checks passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify public assets against the signed local checksum
        run: node scripts/verify-published-release.mjs --repo Airisua/heartopia-photo-tool --tag "$RELEASE_TAG" --summary artifacts/release/release-summary.json
