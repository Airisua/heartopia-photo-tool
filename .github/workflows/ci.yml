name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 verification
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust formatting
        run: |
          cargo fmt --manifest-path crates/photo-core/Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: |
          cargo clippy --manifest-path crates/photo-core/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests
        run: |
          cargo test --manifest-path crates/photo-core/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Privacy scanner tests
        run: node --test scripts/privacy-scan.node.mjs

      - name: Secret and path scan
        run: |
          node scripts/scan-secrets.mjs
          node scripts/scan-secrets.mjs --history

      - name: Release configuration preflight
        run: node scripts/preflight-release.mjs --ci
